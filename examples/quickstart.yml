# Quick start: run a piece of Python on a fresh boxd machine.
#
# Start (code) -> boxd Run Code -> End (stdout, exit_code)
#
# Run Code gets no machine_id, so the plugin creates a machine for this one
# call and deletes it when the code has finished.
#
# Import it in Dify with Studio > Import DSL file. The boxd plugin must be
# installed and authorized first.
app:
  name: boxd quick start
  description: Run Python on a fresh boxd machine that is deleted afterwards.
  mode: workflow
  icon: 📦
  icon_background: '#E4E4E7'
  icon_type: emoji
  use_icon_as_answer_icon: false
kind: app
version: 0.3.1
dependencies: []
workflow:
  conversation_variables: []
  environment_variables: []
  features: {}
  graph:
    nodes:
    - id: start
      type: custom
      data:
        type: start
        title: Start
        desc: ''
        variables:
        - variable: code
          label: Python code
          type: paragraph
          required: true
          max_length: 10000
          default: 'import platform

            print(''hello from'', platform.node())'
      position:
        x: 80
        y: 280
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
    - id: run
      type: custom
      data:
        type: tool
        title: Run Code
        desc: ''
        provider_id: boxd/boxd/boxd
        provider_name: boxd/boxd/boxd
        provider_type: builtin
        tool_name: run_code
        tool_label: Run Code
        tool_configurations: {}
        tool_parameters:
          code:
            type: mixed
            value: '{{#start.code#}}'
          language:
            type: constant
            value: python
      position:
        x: 400
        y: 280
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
    - id: end
      type: custom
      data:
        type: end
        title: End
        desc: ''
        outputs:
        - variable: stdout
          value_selector:
          - run
          - stdout
        - variable: exit_code
          value_selector:
          - run
          - exit_code
      position:
        x: 720
        y: 280
      width: 244
      height: 90
      sourcePosition: right
      targetPosition: left
    edges:
    - id: start-source-run
      type: custom
      source: start
      sourceHandle: source
      target: run
      targetHandle: target
      data:
        sourceType: start
        targetType: tool
    - id: run-source-end
      type: custom
      source: run
      sourceHandle: source
      target: end
      targetHandle: target
      data:
        sourceType: tool
        targetType: end
